services:
  mariadb:
    image: mariadb:11
    container_name: e-utilities-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: e_utilities_cost
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - e-utilities-network
    restart: unless-stopped

  backend:
    image: ${DOCKER_HUB_USERNAME}/e-utilities-cost-backend:latest
    container_name: e-utilities-backend
    environment:
      NODE_ENV: production
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: e_utilities_cost
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY: 1h
      JWT_REFRESH_EXPIRY: 7d
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "300099:3000"
    depends_on:
      - mariadb
    networks:
      - e-utilities-network
    restart: unless-stopped

  frontend:
    image: ${DOCKER_HUB_USERNAME}/e-utilities-cost-frontend:latest
    container_name: e-utilities-frontend
    ports:
      - "30098:80"
    depends_on:
      - backend
    networks:
      - e-utilities-network
    restart: unless-stopped

volumes:
  mariadb_data:

networks:
  e-utilities-network:
    driver: bridge
