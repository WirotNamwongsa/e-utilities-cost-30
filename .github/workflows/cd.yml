name: Deploy to Docker Server

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  REGISTRY_IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/e-utilities-cost-backend
  REGISTRY_IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/e-utilities-cost-frontend

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "❌ DOCKERHUB_USERNAME secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "❌ DOCKERHUB_TOKEN secret is not set"
            exit 1
          fi
          echo "✅ Docker Hub secrets are configured"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE_BACKEND }}:latest
            ${{ env.REGISTRY_IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE_BACKEND }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE_BACKEND }}:buildcache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE_FRONTEND }}:latest
            ${{ env.REGISTRY_IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE_FRONTEND }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE_FRONTEND }}:buildcache,mode=max

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd /path/to/your/project
            git pull origin main || true
            export DOCKER_HUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export DB_ROOT_PASSWORD='${{ secrets.DB_ROOT_PASSWORD }}'
            export DB_USER='${{ secrets.DB_USER }}'
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            export JWT_SECRET='${{ secrets.JWT_SECRET }}'
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps

      - name: Notify deployment complete
        run: echo "🚀 Deployment finished successfully"
